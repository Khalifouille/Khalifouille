name: Génération du snake de contributions

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}    
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Génère le SVG du snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Khalifouille
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publie le résultat sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}